<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tristo's</title>
  <meta name="description" content="Los jueguitos de la casa." />
  <meta name="theme-color" content="#060606" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Tristo's" />
  <meta property="og:description" content="Los jueguitos de la casa." />
  <meta property="og:url" content="https://youarethead.com.ar/tristos" />
  <meta property="og:image" content="/logo.png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=8" />
  <link rel="stylesheet" href="/holding.css?v=6" />
  <link rel="stylesheet" href="/hub.css?v=5" />
  <link rel="stylesheet" href="/game.css?v=4" />
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <canvas id="world" aria-hidden="true"></canvas>

  <header class="hd-nav">
    <a class="brand" href="/">youarethead.com.ar</a>
    <nav class="hd-links">
      <a href="/" class="nav-game">&#8592; Volver</a>
      <a href="/perfil" class="nav-game" id="navPerfil">entrar</a>
    </nav>
  </header>

  <main class="th-main th-col">
    <div id="th-page"></div>
    <section class="hd-chat" aria-label="Chat en vivo">
      <div class="hd-chat-head"><span class="hd-dot" aria-hidden="true"></span> Chat en vivo</div>
      <div class="hd-log" id="chat-log" aria-live="polite"></div>
      <form class="hd-form" id="chat-form" novalidate>
        <input id="chat-name" class="hd-name" type="text" maxlength="20" placeholder="tu nombre" aria-label="Tu nombre" autocomplete="off" />
        <div class="hd-row">
          <input id="chat-text" class="hd-text" type="text" maxlength="200" placeholder="escribí algo..." aria-label="Mensaje" autocomplete="off" />
          <button id="chat-send" class="hd-send" type="submit">Enviar</button>
        </div>
        <p class="hd-msg" id="chat-msg" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <audio id="snd-audio" src="/ambient.mp3" loop preload="auto" playsinline></audio>
  <button id="snd" class="snd" type="button" aria-label="Activar música" aria-pressed="false" title="Música">
    <span class="snd-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
  </button>

  <script src="/holding.js?v=9" defer></script>
  <script src="/game.js?v=9" defer></script>
  <script src="/hub.js?v=9" defer></script>
  <script src="/notify.js?v=1" defer></script>
</body>
</html>
